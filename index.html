<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff7e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>小耳朵英语 · 二年级上册</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      .listen-choice-actions, .dictation-listen-actions { margin-bottom: 28px; }
      .dictation-actions button:disabled { cursor: not-allowed; opacity: .55; color: #746d7c; border-color: #d8d3df; background: #ebe7ee; }
      .study-actions { flex-wrap: nowrap; }
      .study-actions button { white-space: nowrap; }
      .curriculum-select { padding: 6px 25px 6px 9px; border: 1px solid #d8c3ec; border-radius: 999px; color: var(--purple); background: #faf6ff; font: inherit; font-size: .78rem; font-weight: 900; }
      .offline-button { padding: 6px 9px; border: 1px solid #9cc9bd; border-radius: 999px; color: #227158; background: #f1fbf6; font-size: .72rem; font-weight: 900; white-space: nowrap; }
      .initial-reader-loader { display: grid; min-height: min(68vw, 420px); place-items: center; align-content: center; gap: 12px; color: var(--muted); background: linear-gradient(135deg,#fffaf1,#f6efff); font-size: .9rem; font-weight: 800; }
      .initial-reader-loader span { width: 26px; height: 26px; border: 3px solid #dfc9f6; border-top-color: var(--purple); border-radius: 50%; animation: reader-spin .8s linear infinite; }
      @media (max-width: 480px) { .topbar { align-items:flex-start; flex-wrap:wrap; gap:8px; } .topbar-actions { width:100%; justify-content:flex-end; gap:7px; } .offline-button { padding:5px 7px; font-size:.66rem; } }
      @media (max-width: 360px) { .study-actions { gap: 6px; } .study-actions button { padding: 10px 9px; font-size: .82rem; } }
    </style>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./resources/icons/apple-touch-icon.png" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="#top" aria-label="返回首页"><span>◎</span> 小耳朵英语</a>
        <div class="topbar-actions"><button class="offline-button" id="download-offline" type="button">⇩ 离线下载</button><button class="install-button" id="install-app" type="button" hidden>⬇ 添加到主屏幕</button><select class="curriculum-select" id="curriculum-select" aria-label="选择年级和学期"><option value="shenzhen-hj-2025-grade-2-semester-1">二年级 · 上册</option></select></div>
      </header>

      <section class="hero" id="top" aria-labelledby="unit-title">
        <div class="hero-copy">
          <h1 id="unit-title">What can you do with your five senses?</h1>
          <p class="subtitle">五感小侦探</p>
          <div class="hero-actions">
            <button class="primary" id="play-all"><span aria-hidden="true">▶</span> 从头听一遍</button>
          </div>
        </div>
        <div class="sense-orbit" aria-hidden="true">
          <span>👀</span><span>👂</span><span>👃</span><span>✋</span><span>👅</span><i class="sense-label"><svg viewBox="0 0 48 42" aria-hidden="true"><path d="M5 5H43L24 38Z" /></svg><span>听</span><span>说</span><span>玩</span></i>
        </div>
      </section>

      <nav class="jump-nav" aria-label="课程导航" hidden>
        <a href="#reader">课本点读</a><a href="#words">单词</a><a href="#sentences">句子</a><a href="#practice">跟读</a>
      </nav>

      <section class="section reader-section" id="reader" aria-labelledby="reader-title">
        <div class="learning-switch" role="tablist" aria-label="学习模式"><button class="active" id="reader-mode" type="button" role="tab" aria-selected="true">📖 点读</button><button id="vocabulary-mode" type="button" role="tab" aria-selected="false">🔤 单词</button></div>
        <div id="reader-content"><div class="section-heading"><div><h2 id="reader-title">点读</h2></div><div class="reader-controls"><button class="slow-button" id="toggle-slow" type="button">🐢 慢速：关</button><span class="count">紫色圈可点击</span></div></div>
          <div class="page-tabs" id="page-tabs" aria-label="课本页选择"></div>
          <div class="reader-stage" id="reader-stage" aria-busy="true"><div class="initial-reader-loader" role="status"><span></span><span>正在准备教材…</span></div></div>
        </div>
      </section>

      <section class="section vocabulary-section" id="vocabulary" aria-labelledby="words-title" hidden>
        <div class="section-heading"><div><p class="eyebrow">听、认、拼</p><h2 id="words-title">单词学习</h2></div><div class="reader-controls"><button class="slow-button" id="toggle-slow-vocabulary" type="button">🐢 慢速：关</button><span class="count" id="word-count"></span></div></div>
        <div class="vocabulary-tabs" role="tablist" aria-label="单词模式"><button class="active" data-vocab-view="study" type="button">学习</button><button data-vocab-view="choice" type="button">中英互认</button><button data-vocab-view="listen-choice" type="button">听音选词义</button><button data-vocab-view="dictation" type="button">听写</button></div>
        <div class="vocab-study" id="vocab-study"></div>
        <div class="vocab-practice" id="vocab-practice" hidden></div>
      </section>

      <section class="section sentences" id="sentences" aria-labelledby="sentences-title" hidden>
        <div class="section-heading"><div><p class="eyebrow">再读句子</p><h2 id="sentences-title">故事里的英语</h2></div><button class="icon-button" id="stop-audio" aria-label="停止播放">■</button></div>
        <div class="playlist" id="sentence-list"></div>
      </section>

      <section class="section practice-section" id="practice" aria-labelledby="practice-title" hidden>
        <div class="practice-card">
          <div class="practice-copy"><p class="eyebrow">跟读小站</p><h2 id="practice-title">读给自己听</h2><p>先点句子听原声，再按住录音。录音只保留在这台设备里。</p></div>
          <div class="record-panel">
            <p class="chosen-line" id="chosen-line">先从上面选择一句英语</p>
            <button class="record-button" id="record-button" disabled><span class="record-dot"></span><span id="record-label">开始录音</span></button>
            <div class="recording-tools" id="recording-tools" hidden>
              <audio controls id="recording-playback"></audio>
              <button class="text-button" id="delete-recording">删除这次录音</button>
            </div>
            <p class="record-status" id="record-status" role="status">浏览器会在首次录音时请求麦克风权限。</p>
          </div>
        </div>
      </section>

      <section class="section book-section" id="book" aria-labelledby="book-title" hidden>
        <div class="section-heading"><div><p class="eyebrow">需要时再看</p><h2 id="book-title">课本对照</h2></div></div>
        <button class="book-card" id="book-preview" type="button" aria-haspopup="dialog"><img src="./resources/curricula/shenzhen-hj-2025-grade-2-semester-1/pages/unit-1-page-3.webp" alt="Unit 1 五感单词课本页" /><span><h3>把课本装进口袋 <b>↗</b></h3><p>点开查看大图，和实体课本核对。</p><p class="small">当前已录入 Unit 1 的单词和故事句。</p></span></button>
      </section>
    </main>
    <footer class="unit-dock" aria-label="单元选择"><p>选择单元</p><div class="unit-tabs" id="unit-tabs"></div></footer>
    <div class="book-modal" id="book-modal" hidden role="dialog" aria-modal="true" aria-labelledby="book-modal-title">
      <button class="modal-backdrop" id="close-book-backdrop" type="button" aria-label="关闭课本大图"></button>
      <div class="modal-sheet">
        <div class="modal-header"><div><p class="eyebrow">UNIT 01 · 课本第 3 页</p><h2 id="book-modal-title">五感单词对照</h2></div><button class="close-button" id="close-book" type="button" aria-label="关闭">×</button></div>
        <img src="./resources/curricula/shenzhen-hj-2025-grade-2-semester-1/pages/unit-1-page-3.webp" alt="Unit 1 五感单词课本页大图" />
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script defer src="./content/curricula/shenzhen-hj-2025/grade-2/semester-1/units/unit-1.js"></script>
    <script defer src="./content/curricula/shenzhen-hj-2025/grade-2/semester-1/units/unit-2.js"></script>
    <script defer src="./content/curricula/shenzhen-hj-2025/grade-2/semester-1/units/unit-3.js"></script>
    <script defer src="./content/curricula/shenzhen-hj-2025/grade-2/semester-1/units/unit-4.js"></script>
    <script defer src="./content/curricula/shenzhen-hj-2025/grade-2/semester-1/units/unit-5.js"></script>
    <script defer src="./content/curricula/shenzhen-hj-2025/grade-2/semester-1/units/unit-6.js"></script>
    <script defer src="./content/curricula/shenzhen-hj-2025/grade-2/semester-1/units/other.js"></script>
    <script defer src="./content/curricula/shenzhen-hj-2025/grade-2/semester-1/practice/vocabulary/word-list-1.js"></script>
    <script defer src="./resources/curricula/shenzhen-hj-2025-grade-2-semester-1/audio/manifest.js"></script>
    <script defer src="./resources/curricula/shenzhen-hj-2025-grade-2-semester-1/offline-assets.js"></script>
    <script defer src="./main.js"></script>
  </body>
</html>
